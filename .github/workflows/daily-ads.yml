name: Daily Ad Automation

# Runs 30 min AFTER phnews's daily-news (cron "0 23 * * *") so today's topics
# are already in Supabase. Generates creatives and PAUSED Facebook drafts, then
# pulls yesterday's insights and writes content suggestions.
#
# SAFETY: this workflow NEVER launches ads or spends. Every object is created
# PAUSED; FACEBOOK_MODE defaults to 'stub'. A human reviews artifacts/drafts (or
# Ads Manager in live mode) and flips review_state out-of-band to launch.
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      region:
        description: "Region to run (ph, id, or both)"
        required: false
        default: "both"

permissions:
  contents: write

concurrency:
  group: daily-ads-automation
  cancel-in-progress: false

jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
      IMAGE_ASPECT_RATIOS: ${{ vars.IMAGE_ASPECT_RATIOS || '1:1' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      # Same mapping as phnews: local var SUPABASE_SERVICE_KEY <- CI secret.
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FACEBOOK_MODE: ${{ vars.FACEBOOK_MODE || 'stub' }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_AD_ACCOUNT_ID: ${{ secrets.FB_AD_ACCOUNT_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PIXEL_ID: ${{ secrets.FB_PIXEL_ID }}
      FB_PLACEMENTS: ${{ vars.FB_PLACEMENTS || 'FEED' }}
      LANDING_BASE_URL: ${{ vars.LANDING_BASE_URL || 'https://phnews.example/ph' }}
      DAILY_AD_BUDGET_CAP: ${{ vars.DAILY_AD_BUDGET_CAP || '2000' }}
      DAILY_AD_LIMIT: ${{ vars.DAILY_AD_LIMIT || '3' }}
      VARIANTS_PER_TOPIC: ${{ vars.VARIANTS_PER_TOPIC || '1' }}
      FEW_SHOT_ENABLED: ${{ vars.FEW_SHOT_ENABLED || 'true' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull yesterday's insights + write content suggestions
        run: |
          for r in ph id; do
            python scripts/run_daily_insights.py --region "$r" || true
          done

      - name: Generate creatives + PAUSED drafts
        run: |
          TODAY="$(date -u +%F)"
          for r in ph id; do
            python scripts/run_daily_ads.py --region "$r" --date "$TODAY"
          done

      - name: Export human-review digest + Facebook bulk CSV
        run: |
          TODAY="$(date -u +%F)"
          python scripts/export_review.py --date "$TODAY"
          python scripts/export_facebook_bulk.py --date "$TODAY"

      - name: Commit draft + review artifacts
        run: |
          TODAY="$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "artifacts/drafts/${TODAY}" "artifacts/review/${TODAY}.html" \
                     "artifacts/csv/${TODAY}_facebook_bulk.csv" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new draft artifacts to commit."
          else
            git commit -m "Automated ad drafts ${TODAY}"
            git push
          fi
